# Configuration Prometheus de reference pour la stack Otter.
# Chargee par le service `prometheus` du profil `monitoring` (docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otter-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]
