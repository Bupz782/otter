version: "3.8"

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    # The foundry image entrypoint is `/bin/sh -c`: both list and string
    # `command:` forms end up word-split by the shell and anvil loses its
    # flags (binds 127.0.0.1, unreachable through the published port).
    # Overriding the entrypoint passes argv straight to anvil.
    # To fork a network, add "--fork-url", "${ANVIL_FORK_URL}" to the list
    # below and set ANVIL_FORK_URL.
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NOIR_VERSION: ${NOIR_VERSION:-1.0.0-beta.22}
        # Must match .bb-version: the committed DelegationVerifier was
        # generated by this bb — a different bb produces proofs the verifier
        # rejects with ProofLengthWrongWithLogN.
        BB_VERSION: ${BB_VERSION:-5.0.0-nightly.20260522}
    ports:
      - "3001:3001"
    environment:
      OTTER_API_PORT: "3001"
      OTTER_RPC_URL: "http://anvil:8545"
      OTTER_CHAIN_ID: "31337"
      # Execution on the local vault: lets the orchestrator run the full
      # intent pipeline (proof → submit → confirm) against anvil.
      OTTER_VAULT_ADDRESS: "${OTTER_VAULT_ADDRESS:-0x0165878A594ca255338adfa4d48449f69242Eb8F}"
      OTTER_EXECUTION_ENABLED: "${OTTER_EXECUTION_ENABLED:-true}"
      # Required by config validation when execution is enabled; anvil serves
      # the Sepolia address set for oracle lookups.
      OTTER_NETWORK: "${OTTER_NETWORK:-sepolia}"
      OTTER_DATABASE_URL: "/data/otter.db"
      # Demo defaults below match the deterministic anvil deploy order
      # (account #0, fresh chain): TestToken(nonce 0) -> OtterBridge(1) ->
      # BridgeToken(2) -> DelegationVerifier(3) -> DelegationVault(4) ->
      # SolvencyVerifier(5) -> SolvencyRegistry(6). Redeploy in that order
      # after an anvil reset, or override the env vars at launch.
      OTTER_NETWORKS: "${OTTER_NETWORKS:-default=http://anvil:8545|0x0165878A594ca255338adfa4d48449f69242Eb8F|31337|0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}"
      OTTER_SOLVENCY_REGISTRY: "${OTTER_SOLVENCY_REGISTRY:-0x610178dA211FEF7D417bC0e6FeD39F05609AD788}"
      OTTER_PRIVATE_KEY: "${OTTER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}"
      OTTER_CIRCUIT_DIR: "/app/delegation_circuit"
      OTTER_NARGO_BIN: "/usr/local/bin/nargo"
      OTTER_BB_BIN: "/usr/local/bin/bb"
      OTTER_MIGRATIONS_DIR: "/app/crates/infrastructure/migrations"
      RUST_LOG: "info"
    volumes:
      - otter-data:/data
    depends_on:
      anvil:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  otter-data:
