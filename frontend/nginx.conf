# Upgrade only when the client asks for it (WebSocket), empty otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker embedded DNS: re-resolve the api upstream on every request.
        # A static proxy_pass resolves api:3001 ONCE at nginx startup — after
        # an api container recreate (new IP) every call 502s until nginx is
        # restarted. The variable form forces runtime resolution.
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket upgrade (/api/v1/ws realtime events).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
