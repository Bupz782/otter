# Otter V1 Prometheus alerting rules
# Load this file into Prometheus via `rule_files`.

groups:
  - name: otter-agent
    interval: 30s
    rules:
      - alert: OtterAgentDown
        expr: up{job="otter-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Otter API is down"
          description: "The Otter API job {{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: OtterHighErrorRate
        expr: rate(otter_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Otter agent error rate is high"
          description: "Error rate is {{ $value }} errors/sec over the last 5 minutes."

      - alert: OtterExecutionStalled
        expr: rate(otter_conditions_met_total[10m]) > 0 and rate(otter_executions_total[10m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Otter executions are stalled"
          description: "Conditions were met but no on-chain executions succeeded in the last 10 minutes. Check agent ETH balance, vault address and /metrics."

      - alert: OtterNoPriceUpdates
        expr: rate(otter_price_updates_total[10m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Otter price monitoring stalled"
          description: "No price updates were received in the last 10 minutes. Verify RPC connectivity and oracle configuration."

      - alert: OtterProofPipelineSlow
        expr: otter_proof_prove_seconds > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Otter Noir proof generation is slow"
          description: "The last bb prove step took {{ $value }} seconds, which is above the 30s threshold."

      # The following alerts reference metrics that are not yet emitted by the
      # API metrics endpoint. They are preserved here because the CI/DevOps plan
      # mandated these exact rules; enable them once the corresponding counters
      # and gauges are instrumented in the application code.
