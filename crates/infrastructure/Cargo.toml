[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chat"
path = "src/bin/chat.rs"

[[bin]]
name = "test-llm"
path = "src/bin/test.rs"

[[bin]]
name = "generate-fixture"
path = "src/bin/generate_fixture.rs"

[dependencies]
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
regex = "1.10"
thiserror = "2.0"
application = { path = "../application" }
domain = { path = "../domain" }
llama-cpp-2 = "0.1.132"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
blake2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
alloy = { version = "0.2", features = ["full"] }
eth-keystore = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "migrate", "macros", "uuid"] }
async-trait = "0.1"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serial_test = "3.2"
