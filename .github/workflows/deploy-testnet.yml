name: Deploy Testnet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Read tool versions
        id: versions
        run: |
          set -euo pipefail
          noir_version=$(grep compiler_version delegation_circuit/Nargo.toml | sed 's/.*= "\(.*\)".*/\1/')
          bb_version=$(cat .bb-version)
          echo "noir_version=$noir_version" >> "$GITHUB_OUTPUT"
          echo "bb_version=$bb_version" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          build-args: |
            NOIR_VERSION=${{ steps.versions.outputs.noir_version }}
            BB_VERSION=${{ steps.versions.outputs.bb_version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: testnet
    steps:
      - name: Deploy to testnet host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TESTNET_HOST }}
          username: ${{ secrets.TESTNET_USER }}
          key: ${{ secrets.TESTNET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/otter
            repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            export OTTER_API_IMAGE=ghcr.io/${repo}/api:${{ github.ref_name }}
            export OTTER_FRONTEND_IMAGE=ghcr.io/${repo}/frontend:${{ github.ref_name }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      - name: Run smoke tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TESTNET_HOST }}
          username: ${{ secrets.TESTNET_USER }}
          key: ${{ secrets.TESTNET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/otter
            export OTTER_API_URL=http://localhost:3001
            ./scripts/smoke-test.sh
